apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: postgres
spec:
  replicas: 1
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          env:
          - name: POSTGRES_USER
            value: nasa
          - name: POSTGRES_PASSWORD
            value: "212829908"
          - name: POSTGRES_DB
            value: nasa_apod
          ports:
            - containerPort: 5432
